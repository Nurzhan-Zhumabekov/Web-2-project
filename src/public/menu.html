<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Zenin</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1046/1046857.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="nav">
        <div class="container">
            <a href="index.html" class="logo">Zenin</a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="index.html#booking">Book</a></li>
            </ul>

            <div class="nav-right">
                <div id="auth-nav" class="auth-nav"></div>
                <a href="#cart" class="cart-btn">Cart <span id="cart-count">(0)</span></a>
            </div>
        </div>
    </nav>

    <section class="menu-section container">
        <h2 class="section-title">Our Menu</h2>
        <div class="filters">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="Appetizer">Appetizers</button>
            <button class="filter-btn" data-category="Main Course">Main</button>
            <button class="filter-btn" data-category="Dessert">Desserts</button>
            <button class="filter-btn" data-category="Beverage">Drinks</button>
        </div>
        <div id="menu-grid" class="menu-grid"></div>
    </section>

    <section id="cart" class="cart-section">
        <div class="container">
            <h2 class="section-title">Your Order</h2>
            <div class="cart-grid">
                <div class="cart-card">
                    <h3>Cart</h3>
                    <div id="cart-items">
                        <p class="empty-msg">Your cart is empty</p>
                    </div>
                </div>
                <div class="cart-card" id="order-form-container" style="display: none;">
                    <h3>Delivery</h3>
                    <form id="order-form">
                        <div class="form-group">
                            <label>Address</label>
                            <input type="text" id="address" required>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="phone" required>
                        </div>
                        <div class="form-group">
                            <label>Payment</label>
                            <select id="payment">
                                <option value="cash">Cash</option>
                                <option value="card">Card</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Order</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <section id="admin-panel" class="admin-section" style="display: none;">
        <div class="container">
            <h2 class="section-title">Admin Panel</h2>
            <div class="admin-grid">
                <div class="admin-card">
                    <h3>Menu Items</h3>
                    <form id="admin-menu-form">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="menu-name" required>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <input type="text" id="menu-desc" required>
                        </div>
                        <div class="form-group">
                            <label>Price</label>
                            <input type="number" id="menu-price" min="1" required>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="menu-category" required>
                                <option value="Appetizer">Appetizer</option>
                                <option value="Main Course">Main Course</option>
                                <option value="Dessert">Dessert</option>
                                <option value="Beverage">Beverage</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Image URL</label>
                            <input type="url" id="menu-image">
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Add Item</button>
                    </form>
                    <div id="admin-menu-list" class="admin-list"></div>
                </div>
                <div class="admin-card">
                    <h3>Bookings</h3>
                    <div id="admin-bookings" class="admin-list"></div>
                </div>
                <div class="admin-card">
                    <h3>Orders</h3>
                    <div id="admin-orders" class="admin-list"></div>
                </div>
            </div>
        </div>
    </section>

    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="auth-forms"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
